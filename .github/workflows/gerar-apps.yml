name: Gerar aplicativos

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: App Android (celular e TV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar APK
        shell: bash
        run: |
          set -o pipefail
          {
            set -ex
            unzip -q -o '*.zip'
            export JAVA_HOME="$JAVA_HOME_17_X64"
            export PATH="$JAVA_HOME/bin:$PATH"
            export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
            java -version
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            ls "$ANDROID_HOME" "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
            curl -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
            unzip -q -o gradle.zip -d "$RUNNER_TEMP"
            cd maazar-play/android
            "$RUNNER_TEMP/gradle-8.7/bin/gradle" assembleRelease --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk ../../Maazar-Play.apk
          } 2>&1 | tee build.log
      - name: Guardar relatorio
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/rel && cp build.log /tmp/rel/android.log 2>/dev/null || echo "sem relatorio" > /tmp/rel/android.log
          cd /tmp/rel && git init -q && git checkout -q -b relatorio-android && git add . && git -c user.name=robo -c user.email=robo@local commit -qm relatorio
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" relatorio-android
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Maazar-Play.apk

  windows:
    name: App Windows (notebook)
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Gerar programa
        shell: bash
        run: |
          set -o pipefail
          {
            set -e
            unzip -q -o '*.zip' || 7z x -y '*.zip' > /dev/null
            cp -r maazar-play/web maazar-play/desktop/web
            cd maazar-play/desktop
            npm install
            npm run dist
          } 2>&1 | tee build.log
      - name: Guardar relatorio
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/rel" && cp build.log "$RUNNER_TEMP/rel/windows.log" 2>/dev/null || echo "sem relatorio" > "$RUNNER_TEMP/rel/windows.log"
          cd "$RUNNER_TEMP/rel" && git init -q && git checkout -q -b relatorio-windows && git add . && git -c user.name=robo -c user.email=robo@local commit -qm relatorio
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" relatorio-windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: maazar-play/desktop/dist/Maazar-Play-Windows.exe

  publicar:
    name: Publicar para download
    needs: [android, windows]
    if: always() && (needs.android.result == 'success' || needs.windows.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: saida
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Maazar Play 1.0.${{ github.run_number }}
          body: |
            **Maazar-Play.apk** — celular Android, Android TV, Google TV, TV Box e Fire TV.
            **Maazar-Play-Windows.exe** — notebook ou PC com Windows (não precisa instalar, é só abrir).
          files: saida/*
          fail_on_unmatched_files: false
