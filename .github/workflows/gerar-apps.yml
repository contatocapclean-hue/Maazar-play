name: Gerar aplicativos

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  # E-mail de contato mostrado no site (Settings > Secrets and variables > Actions > Variables)
  CONTATO_EMAIL: ${{ vars.CONTATO_EMAIL }}

jobs:
  # ------------------------------------------------------------------ Android
  android:
    name: Android (celular, TV, Fire TV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar APK e AAB
        shell: bash
        env:
          KS_B64: ${{ secrets.MAAZAR_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.MAAZAR_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          {
            set -ex
            unzip -q -o '*.zip'
            export JAVA_HOME="$JAVA_HOME_17_X64"
            export PATH="$JAVA_HOME/bin:$PATH"
            export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "platforms;android-36" "build-tools;35.0.0" > /dev/null || true
            curl -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
            unzip -q -o gradle.zip -d "$RUNNER_TEMP"
            cd maazar-play/android
            "$RUNNER_TEMP/gradle-8.13/bin/gradle" assembleDiretoRelease assembleLojaRelease bundleLojaRelease --no-daemon --stacktrace
            # instalação direta (Downloader, TV Box): com aviso de atualização
            cp app/build/outputs/apk/direto/release/app-direto-release.apk ../../Maazar-Play.apk
            # lojas (Amazon Appstore): sem atualização própria
            cp app/build/outputs/apk/loja/release/app-loja-release.apk ../../Maazar-Play-Lojas.apk
            cp app/build/outputs/bundle/lojaRelease/app-loja-release.aab ../../Maazar-Play-GooglePlay.aab
            cd ../..
            set +x
            bash maazar-play/ci/assinar-aab.sh Maazar-Play-GooglePlay.aab
          } 2>&1 | tee build.log
      - name: Guardar relatório
        if: always()
        shell: bash
        run: bash maazar-play/ci/relatorio.sh android build.log "${{ github.token }}" || true
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            Maazar-Play.apk
            Maazar-Play-Lojas.apk
            Maazar-Play-GooglePlay.aab

  # ------------------------------------------------------------------ Teste no emulador Android
  teste-android:
    name: Teste no emulador Android
    needs: android
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q -o '*.zip'
      - uses: actions/download-artifact@v4
        with:
          name: android
      - name: Ativar aceleração (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Abrir o app no emulador e fotografar a tela
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash maazar-play/ci/teste-emulador.sh
      - name: Guardar fotos do teste
        if: always()
        shell: bash
        run: bash maazar-play/ci/relatorio.sh teste teste "${{ github.token }}" || true

  # ------------------------------------------------------------------ Computador
  windows:
    name: Windows
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Montar programa
        shell: bash
        run: |
          set -o pipefail
          {
            set -e
            unzip -q -o '*.zip' || 7z x -y '*.zip' > /dev/null
            cp -r maazar-play/web maazar-play/desktop/web
            cd maazar-play/desktop
            npm install
            npm run dist
          } 2>&1 | tee build.log
      - name: Guardar relatório
        if: always()
        shell: bash
        run: bash maazar-play/ci/relatorio.sh windows build.log "${{ github.token }}" || true
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: maazar-play/desktop/dist/Maazar-Play-Windows.exe

  mac:
    name: Mac
    runs-on: macos-latest
    continue-on-error: true
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Montar programa
        shell: bash
        run: |
          set -o pipefail
          {
            set -e
            unzip -q -o '*.zip'
            cp -r maazar-play/web maazar-play/desktop/web
            cd maazar-play/desktop
            npm install
            npm run dist:mac
          } 2>&1 | tee build.log
      - name: Guardar relatório
        if: always()
        shell: bash
        run: bash maazar-play/ci/relatorio.sh mac build.log "${{ github.token }}" || true
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: maazar-play/desktop/dist/Maazar-Play-Mac.dmg

  linux:
    name: Linux
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Montar programa
        shell: bash
        run: |
          set -o pipefail
          {
            set -e
            unzip -q -o '*.zip'
            cp -r maazar-play/web maazar-play/desktop/web
            cd maazar-play/desktop
            npm install
            npm run dist:linux
          } 2>&1 | tee build.log
      - name: Guardar relatório
        if: always()
        shell: bash
        run: bash maazar-play/ci/relatorio.sh linux build.log "${{ github.token }}" || true
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: maazar-play/desktop/dist/Maazar-Play-Linux.AppImage

  # ------------------------------------------------------------------ TVs LG e Samsung
  tvs:
    name: TVs LG e Samsung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Montar pacotes
        shell: bash
        run: |
          set -o pipefail
          {
            set -ex
            unzip -q -o '*.zip'
            VER="$(tr -d '\r\n ' < maazar-play/VERSAO).${GITHUB_RUN_NUMBER}"
            # LG (webOS): pacote .ipk
            mkdir -p lg/app lg/out
            cp -r maazar-play/web/. lg/app/
            cp maazar-play/tv-lg/* lg/app/
            node -e "const f='lg/app/appinfo.json';const j=require('./'+f);j.version='$VER';require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
            npm install --no-save --prefix lg @webos-tools/cli@3.2.6
            lg/node_modules/.bin/ares-package lg/app -o lg/out --no-minify
            cp lg/out/*.ipk Maazar-Play-LG.ipk
            # Samsung (Tizen): projeto pronto para assinar no Tizen Studio
            mkdir -p samsung/MaazarPlay
            cp -r maazar-play/web/. samsung/MaazarPlay/
            cp maazar-play/tv-samsung/config.xml maazar-play/tv-samsung/icon.png samsung/MaazarPlay/
            cp maazar-play/tv-samsung/LEIA-ME-SAMSUNG.txt samsung/
            sed -i "s/version=\"1.1.0\"/version=\"$VER\"/" samsung/MaazarPlay/config.xml
            (cd samsung && zip -qr ../Maazar-Play-Samsung-projeto.zip .)
          } 2>&1 | tee build.log
      - name: Guardar relatório
        if: always()
        shell: bash
        run: bash maazar-play/ci/relatorio.sh tvs build.log "${{ github.token }}" || true
      - uses: actions/upload-artifact@v4
        with:
          name: tvs
          path: |
            Maazar-Play-LG.ipk
            Maazar-Play-Samsung-projeto.zip

  # ------------------------------------------------------------------ Site (GitHub Pages): download, privacidade e termos
  site:
    name: Publicar o site do app
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar site
        shell: bash
        run: |
          unzip -q -o '*.zip'
          bash maazar-play/ci/preparar-site.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: maazar-play/site
      - id: deploy
        uses: actions/deploy-pages@v4

  # ------------------------------------------------------------------ Publicação
  publicar:
    name: Publicar para download
    needs: [android, windows, mac, linux, tvs]
    if: always() && (needs.android.result == 'success' || needs.windows.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ler a versão
        id: versao
        shell: bash
        run: |
          unzip -q -o '*.zip'
          echo "ver=$(tr -d '\r\n ' < maazar-play/VERSAO).${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: saida
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versao.outputs.ver }}
          name: Maazar Play ${{ steps.versao.outputs.ver }}
          body: |
            **Maazar-Play.apk** — celular Android, Android TV, Google TV, TV Box e Fire TV (instalação direta, avisa quando há versão nova).
            **Maazar-Play-Lojas.apk** — para enviar à Amazon Appstore (sem atualização própria).
            **Maazar-Play-GooglePlay.aab** — arquivo para enviar à Google Play.
            **Maazar-Play-Windows.exe** — Windows (é só abrir).
            **Maazar-Play-Mac.dmg** — Mac (na primeira vez: botão direito > Abrir).
            **Maazar-Play-Linux.AppImage** — Linux.
            **Maazar-Play-LG.ipk** — TVs LG (webOS), para enviar ao LG Seller Lounge.
            **Maazar-Play-Samsung-projeto.zip** — TVs Samsung (Tizen), para assinar no Tizen Studio.
          files: saida/*
          fail_on_unmatched_files: false
